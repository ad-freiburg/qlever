# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    # Also run when a label is applied, so that applying the `run-ci` or
    # `run-full-ci` label triggers the checks, see `README.md`.
    types: [ opened, synchronize, reopened, labeled ]

permissions:
  contents: read

jobs:
  codespell:
    # Only run for PRs with the `run-ci` or `run-full-ci` label, see `README.md`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci') ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
