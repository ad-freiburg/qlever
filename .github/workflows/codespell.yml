# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  push:
    branches: [ master ]
  # TEMPORARILY DISABLED for pull requests, so that only the Docker build
  # runs, see `docker-publish.yml` and the diagnostics in `Dockerfile`.

permissions:
  contents: read

jobs:
  codespell:
    # Only run for PRs with the `run-ci` or `run-full-ci` label, see `README.md`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci') ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
