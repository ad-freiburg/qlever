name: "Install various versions of gcc and clang"
description: "dummy description"
inputs:
  compiler:
    description: "Must be `gcc` or `clang`"
    required: true
  compiler-version:
    description: "the version of the compiler (must be major version)"
    required: true
  install-mold:
    description: "Whether to install the `mold` linker. Must be set to false for jobs that run in a `container` of an older distribution (e.g. Ubuntu 20.04), which has no `mold` package"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install gcc
      if :  inputs.compiler == 'gcc' && inputs.compiler-version > 8
      # The standard repositories of the distribution have most versions
      # (Ubuntu 24.04 ships GCC 10 to 14, Ubuntu 26.04 ships GCC 14 to 16), so
      # the packages are installed from there. Only if that fails (for example,
      # for GCC 13 on Ubuntu 22.04), they are taken from the
      # `ubuntu-toolchain-r/test` PPA on Launchpad.
      #
      # NOTE: The PPA server occasionally answers with `503 Service Unavailable`
      # for hours (as on 2026-10-21). `apt-get update` only warns about the
      # unreachable index, and the install then fails because the packages are
      # unknown. Hence the retries.
      run : |
        PACKAGES="gcc-${{inputs.compiler-version}} g++-${{inputs.compiler-version}}"
        if sudo apt-get install -y $PACKAGES; then
          exit 0
        fi
        for ATTEMPT in $(seq 1 10); do
          if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && sudo apt-get install -y $PACKAGES; then
            exit 0
          fi
          echo "Attempt $ATTEMPT of 10 to install from the PPA failed, retrying in 60 s"
          sleep 60
        done
        exit 1
      shell: bash

    - name: Install clang
      if :  inputs.compiler == 'clang'
      # The sed command fixes a bug in `llvm.sh` in combination with the latest version of
      # `apt-key`. Without it the GPG key for the llvm repository is downloaded but deleted
      # immediately after.
      run:  |
        wget https://apt.llvm.org/llvm.sh
        sudo chmod +x llvm.sh
        sed   's/apt-key del/echo/' llvm.sh -iy
        sudo ./llvm.sh ${{inputs.compiler-version}}
        sudo apt install -y clang-${{inputs.compiler-version}}
      shell: bash
    
    - name: Install gcc8
      if :  inputs.compiler == 'gcc' && inputs.compiler-version == 8
      run:  |
        # Ubuntu 20.04 (which jobs with a matching `container` run in) has gcc 8
        # in its standard repositories. On newer releases (like the runner image
        # itself) the packages have to be downloaded from the Ubuntu 20.04
        # archive by hand.
        if sudo apt-get install -y gcc-8 g++-8; then
          exit 0
        fi
        wget http://mirrors.kernel.org/ubuntu/pool/universe/g/gcc-8/gcc-8_8.4.0-3ubuntu2_amd64.deb
        wget http://mirrors.edge.kernel.org/ubuntu/pool/universe/g/gcc-8/gcc-8-base_8.4.0-3ubuntu2_amd64.deb
        wget http://mirrors.kernel.org/ubuntu/pool/universe/g/gcc-8/libgcc-8-dev_8.4.0-3ubuntu2_amd64.deb
        wget http://mirrors.kernel.org/ubuntu/pool/universe/g/gcc-8/cpp-8_8.4.0-3ubuntu2_amd64.deb
        wget http://mirrors.kernel.org/ubuntu/pool/universe/g/gcc-8/libmpx2_8.4.0-3ubuntu2_amd64.deb
        wget http://mirrors.kernel.org/ubuntu/pool/main/i/isl/libisl22_0.22.1-1_amd64.deb
        sudo apt install -y ./libisl22_0.22.1-1_amd64.deb ./libmpx2_8.4.0-3ubuntu2_amd64.deb ./cpp-8_8.4.0-3ubuntu2_amd64.deb ./libgcc-8-dev_8.4.0-3ubuntu2_amd64.deb ./gcc-8-base_8.4.0-3ubuntu2_amd64.deb ./gcc-8_8.4.0-3ubuntu2_amd64.deb
        wget http://mirrors.kernel.org/ubuntu/pool/universe/g/gcc-8/libstdc++-8-dev_8.4.0-3ubuntu2_amd64.deb
        wget http://mirrors.kernel.org/ubuntu/pool/universe/g/gcc-8/g++-8_8.4.0-3ubuntu2_amd64.deb
        sudo apt install -y ./libstdc++-8-dev_8.4.0-3ubuntu2_amd64.deb ./g++-8_8.4.0-3ubuntu2_amd64.deb
      shell: bash
    - name: Install mold linker
      if: inputs.install-mold == 'true'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y mold

