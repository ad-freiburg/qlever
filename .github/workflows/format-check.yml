name: Format check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    # Also run when a label is applied, so that applying the `run-ci` or
    # `run-full-ci` label triggers the checks, see `README.md`.
    types: [ opened, synchronize, reopened, labeled ]
  merge_group:

# The default GITHUB_TOKEN only needs to read the repository here.
permissions:
  contents: read

jobs:
  build:
    # Only run for PRs with the `run-ci` or `run-full-ci` label, see `README.md`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci') ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          # The version in the default Ubuntu repositories is too old (and has some breaking changes),
          # so we install from the official LLVM repository.
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt install -y clang-format-18

      - name: Run the format checker
        run: ${{github.workspace}}/misc/format-check.sh
