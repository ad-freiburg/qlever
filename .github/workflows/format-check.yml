name: Format check

on:
  # CI-trim 2026-09-23: hosted legs skip push/merge_group (GitHub queue
  # latency fanned every merge into dozens of queued jobs). Fleet legs guard
  # master; full signal via 'ci'-labeled PRs or manual dispatch.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# The default GITHUB_TOKEN only needs to read the repository here.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          # The version in the default Ubuntu repositories is too old (and has some breaking changes),
          # so we install from the official LLVM repository.
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt install -y clang-format-18

      - name: Run the format checker
        run: ${{github.workspace}}/misc/format-check.sh
