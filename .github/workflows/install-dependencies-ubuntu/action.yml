name: "Install dependencies via apt"
description: "dummy description"

inputs:
  install-third-party-libraries:
    description: "Should be set to false for conan builds"
    required: true
    default: "true"
  cmake-version:
    description: "Minimum required cmake version"
    required: false
    default: "3.27"
  cmake-build-version:
    description: "The cmake build version to install if the minimum version is not met"
    required: false
    default: "0"
  boost-version:
    description: "The Boost version to install. `latest` installs the most recent version from a PPA, any other value (e.g. `1.71`, the oldest version that QLever is tested with) builds that version from source, as those are not packaged for Ubuntu 24.04. Such old versions have no `Boost::url` and can therefore only be used together with `REDUCED_FEATURE_SET_FOR_CPP17`"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
    - name: Install basic compiler
      run:  |
        sudo apt-get update
        sudo apt-get install -y build-essential
      shell: bash

    - name: Get cmake version
      id: cmake
      run: |
        echo "cmake-version=$(cmake --version | head -n1 | cut -d' ' -f3)" >> $GITHUB_OUTPUT
        echo "Minimum desired version: ${{ inputs.cmake-version }}"
      shell: bash

    - name: Ensure cmake version >= ${{ inputs.cmake-version }}
      if: steps.cmake.outputs.cmake-version < inputs.cmake-version
      run:  |
        sudo apt-get remove -y cmake
        export CMAKE_FULL_VERSION="cmake-${{ inputs.cmake-version }}.${{ inputs.cmake-build-version }}-linux-x86_64"
        wget "https://cmake.org/files/v${{ inputs.cmake-version }}/${CMAKE_FULL_VERSION}.tar.gz"
        tar -xzvf ${CMAKE_FULL_VERSION}.tar.gz
        sudo mv ${CMAKE_FULL_VERSION} /opt/cmake
        echo "/opt/cmake/bin" >> $GITHUB_PATH
        export PATH="/opt/cmake/bin:$PATH"
        cmake --version
      shell: bash

    - name: Install third-party libraries
      if: inputs.install-third-party-libraries == 'true'
      run:  |
        sudo apt-get install -y libicu-dev tzdata libzstd-dev libjemalloc-dev
      shell: bash

    - name: Install boost from PPA
      if: inputs.install-third-party-libraries == 'true' && inputs.boost-version == 'latest'
      run: sudo add-apt-repository -y ppa:mhier/libboost-latest && sudo apt update && sudo apt install -y libboost1.83-all-dev libboost-url1.83-dev libboost-container1.83-dev libboost-filesystem1.83-dev
      shell: bash

    - name: Install Boost ${{inputs.boost-version}} from source
      # Old Boost versions (in particular 1.71) are not packaged for Ubuntu
      # 24.04, so build them from source. Only the components that QLever
      # actually links against are built; `Boost::url` in particular doesn't
      # exist in those versions at all, which is why they can only be used
      # together with `REDUCED_FEATURE_SET_FOR_CPP17=ON`.
      if: inputs.install-third-party-libraries == 'true' && inputs.boost-version != 'latest'
      run: |
        # The development packages of different Boost versions conflict with
        # each other, so remove all preinstalled ones first. Removing a package
        # that isn't installed is not an error, so no `|| true` is needed.
        sudo apt-get remove -y -qq '^libboost.*'
        sudo apt-get update
        # `Boost::iostreams` needs the zlib and bzip2 headers.
        sudo apt-get install -y libbz2-dev zlib1g-dev
        # Boost archives are named like `boost_1_71_0` for version `1.71`.
        BOOST_NAME="boost_$(echo "${{inputs.boost-version}}" | tr . _)_0"
        wget -q "https://archives.boost.io/release/${{inputs.boost-version}}.0/source/${BOOST_NAME}.tar.bz2"
        tar xf "${BOOST_NAME}.tar.bz2"
        cd "${BOOST_NAME}"
        ./bootstrap.sh --prefix=/usr/local --with-libraries=container,filesystem,iostreams,program_options
        # `b2 install` also builds. It has to run as root because it installs
        # into `/usr/local`, which is where CMake then finds Boost without any
        # further hints. The shared libraries are built in addition to the
        # static ones, because CMake looks for the shared ones by default.
        sudo ./b2 -j$(nproc) --prefix=/usr/local variant=release link=static,shared cxxstd=17 install
        sudo ldconfig
      shell: bash

    - name: Install Python packages for E2E tests
      run: sudo apt-get install -y python3-yaml unzip pkg-config python3-icu
      shell: bash
