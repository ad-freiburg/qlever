name: Portable Linux binaries

# Build portable binaries of `qlever-index` and `qlever-server` for Linux
# x86_64 and arm64: statically linked except for glibc, so they run on any
# distribution with a glibc at least as new as the build runner's (which is
# why this uses the oldest supported Ubuntu LTS). See
# `.github/scripts/build-portable-binaries.sh` for the details. After a
# successful build of `master`, the binaries also become the assets of the
# rolling pre-release `latest-master` (see the `release` job below).

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: portable-binaries (${{ matrix.arch }})
    # The compiler (also used in the conan cache key below). The default gcc
    # 11 of Ubuntu 22.04 crashes with an internal compiler error on QLever's
    # C++20 code (at least on arm64), so use gcc 13.
    env:
      CC: gcc-13
      CXX: g++-13
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libjemalloc-dev pipx
          pipx install conan

      - name: Install gcc 13
        uses: ./.github/workflows/install-compiler-ubuntu
        with:
          compiler: gcc
          compiler-version: 13

      - name: Cache conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-portable-${{ env.CC }}-${{ matrix.arch }}-${{ hashFiles('conanfile.txt') }}

      - name: Build, check, and smoke-test the binaries
        run: .github/scripts/build-portable-binaries.sh

      # The binaries of PR builds are only built and smoke-tested, not kept.
      # As a tar archive, uploaded as is, so that the binaries keep their
      # executable bit (a zipped artifact loses all file permissions).
      - name: Pack binaries
        if: github.event_name != 'pull_request'
        run: |
          tar czf qlever-binaries-linux-${{ matrix.arch }}.tar.gz \
            -C build-portable/dist qlever-index qlever-server

      - name: Upload binaries
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: qlever-binaries-linux-${{ matrix.arch }}
          path: qlever-binaries-linux-${{ matrix.arch }}.tar.gz
          archive: false
          if-no-files-found: error

  # The artifacts above can only be downloaded with a GitHub token, so publish
  # the binaries of the latest successfully built `master` commit also as the
  # assets of the pre-release `latest-master`, from where anyone can download
  # them (for example, the end-to-end tests of qlever-control). The assets and
  # the notes are replaced first and the tag is moved last (the release action
  # only creates a tag, it does not move one): if a step fails, the tag still
  # points to the commit whose notes and assets the release had before, and
  # the next successful build of `master` replaces everything anyway.
  release:
    name: Update the `latest-master` release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: qlever-binaries-linux-*
          path: dist
          merge-multiple: true

      - name: Describe the built commit
        id: commit
        run: |
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Replace the assets and the notes of the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-master
          target_commitish: ${{ github.sha }}
          name: Latest master build
          body: >-
            Portable Linux binaries (x86_64 and arm64, statically linked except
            for glibc) of the latest successfully built commit on `master`:
            ${{ github.sha }} (${{ steps.commit.outputs.subject }}), published
            ${{ steps.commit.outputs.date }}. This pre-release is replaced by
            every successful build of `master`. For a stable download, use one
            of the versioned releases.
          prerelease: true
          make_latest: false
          files: dist/qlever-binaries-linux-*.tar.gz
          fail_on_unmatched_files: true

      - name: Move the tag to the built commit
        run: git push --force origin "${{ github.sha }}:refs/tags/latest-master"
