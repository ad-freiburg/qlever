name: Portable Linux binaries

# Build portable binaries of `qlever-index` and `qlever-server` for Linux
# x86_64 and arm64: statically linked except for glibc, so they run on any
# distribution with a glibc at least as new as the build runner's (which is
# why this uses the oldest supported Ubuntu LTS). See
# `.github/scripts/build-portable-binaries.sh` for the details. After a
# successful build of `master`, the binaries also become the assets of the
# rolling pre-release `latest-master` (see the `release` job below).

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: portable-binaries (${{ matrix.arch }})
    # The compiler (also used in the conan cache key below). The default gcc
    # 11 of Ubuntu 22.04 crashes with an internal compiler error on QLever's
    # C++20 code (at least on arm64), so use gcc 13.
    env:
      CC: gcc-13
      CXX: g++-13
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libjemalloc-dev pipx
          pipx install conan

      - name: Install gcc 13
        uses: ./.github/workflows/install-compiler-ubuntu
        with:
          compiler: gcc
          compiler-version: 13

      - name: Cache conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-portable-${{ env.CC }}-${{ matrix.arch }}-${{ hashFiles('conanfile.txt') }}

      - name: Build, check, and smoke-test the binaries
        run: .github/scripts/build-portable-binaries.sh

      # The binaries of PR builds are only built and smoke-tested, not kept.
      - name: Upload binaries
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: qlever-binaries-linux-${{ matrix.arch }}
          path: build-portable/dist/
          if-no-files-found: error

  # The artifacts above can only be downloaded with a GitHub token, so publish
  # the binaries of the latest successfully built `master` commit also as the
  # assets of the pre-release `latest-master`, from where anyone can download
  # them (for example, the end-to-end tests of qlever-control). The tag moves
  # to the built commit, and the assets replace the previous ones.
  release:
    name: Update the `latest-master` release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: qlever-binaries-linux-*
          path: dist

      - name: Move the tag, update the release notes, and replace the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in x86_64 arm64; do
            (cd "dist/qlever-binaries-linux-$arch" \
              && zip "../qlever-binaries-linux-$arch.zip" qlever-index qlever-server)
          done
          git push --force origin "$GITHUB_SHA:refs/tags/latest-master"
          notes="Portable Linux binaries (x86_64 and arm64, statically linked \
          except for glibc) of the latest successfully built commit on \`master\`: \
          $GITHUB_SHA ($(git log -1 --format=%s)), built $(date -u +'%Y-%m-%d %H:%M UTC'). \
          This pre-release is replaced by every successful build of \`master\`. \
          For a stable download, use one of the versioned releases."
          if gh release view latest-master > /dev/null 2>&1; then
            gh release edit latest-master --title "Latest master build" \
              --notes "$notes" --prerelease --latest=false
          else
            gh release create latest-master --title "Latest master build" \
              --notes "$notes" --prerelease --latest=false
          fi
          gh release upload latest-master dist/*.zip --clobber
