name: sonarcloud-analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Also run when a label is applied, s.t. applying the `run-full-ci` label
    # triggers the expensive checks (see `full-ci-gate.yml`).
    types: [ opened, synchronize, reopened, labeled ]

# The default GITHUB_TOKEN only needs to read the repository here.
permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/full-ci-gate.yml
  # NOTE: If this job is skipped, then no `sonarcloud-report` artifact is
  # uploaded for the PR, and `upload-sonarcloud.yml` skips the (expensive)
  # analysis.
  build:
    needs: gate
    if: needs.gate.outputs.run-full-ci == 'true'
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Save PR number and sonarcloud data in same directory
      if: github.event_name == 'pull_request'
      # Note: If you change any of the filenames here, you also have to change them in `upload-sonarcloud.yml`
      run : |
        mkdir -p sonarcloud-report
        echo ${{ github.event.number }} > ./sonarcloud-report/pr
        echo ${{ github.repository }} > ./sonarcloud-report/github_repository
        echo ${GITHUB_REF} > ./sonarcloud-report/github_ref
    - name: Upload sonarcloud artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: sonarcloud-report
        path: sonarcloud-report/
    # Note: for now we do not run the e2e tests for the coverage check

