name: Native build

# Note: There deliberately is no `push: branches: [master]` trigger. Everything
# that lands on `master` has to go through the merge queue, which runs the full
# matrix below (see `isPullRequest`) on the temporary merge branch. A separate
# run for the push to `master` would test the exact same tree again, and any
# failure would be detected too late, namely after the merge.
on:
  pull_request:
    branches: [ master ]
  merge_group:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

# The default GITHUB_TOKEN only needs to read the repository here.
permissions:
  contents: read

jobs:
  build:

    # The CMake configure and build commands are platform-agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        compiler-version: [8, 11, 12, 13, 18, 21]
        warnings: [  "-Wall -Wextra -Werror " ]
        build-type: [Release]
        expensive-tests: [true]
        additional-cmake-options: [""]
        # Some of the builds below are expensive and are therefore not run for
        # every push to a pull request, but only in the merge queue. As this
        # workflow is only triggered by the `pull_request` and the `merge_group`
        # event, `isPullRequest: false` exactly means "this is a merge queue
        # build".
        #
        # TODO<joka921> This is temporarily hardcoded to `false`, such that the
        # merge-queue-only builds (`gcc-12` and `clang-18`, see the `exclude`
        # section below) also run for pull requests. That way
        # we can check whether they pass at all before the merge queue is
        # activated. Undo this by restoring the original value, which is
        #   - ${{github.event_name == 'pull_request'}}
        # This is the ONLY place that has to be changed to undo this.
        isPullRequest:
          - false
        exclude:
          # Compiler versions that we currently don't test at all (there is no
          # `gcc-18`/`gcc-21`, and the following `clang` versions are too old).
          - compiler: gcc
            compiler-version: 8
          - compiler: gcc
            compiler-version: 18
          - compiler: gcc
            compiler-version: 21
          - compiler: clang
            compiler-version: 8
          - compiler: clang
            compiler-version: 11
          - compiler: clang
            compiler-version: 12
          - compiler: clang
            compiler-version: 13
          - compiler: clang
            compiler-version: 15
          - compiler: clang
            compiler-version: 16
          # The following builds are only run in the merge queue, because
          # running them for each single push to a pull request would make the
          # CI unnecessarily expensive.
          - compiler: gcc
            compiler-version: 12
            isPullRequest: true
          - compiler: clang
            compiler-version: 18
            isPullRequest: true
        include:
          - compiler: gcc
            compiler-version: 11
            additional-cmake-options: "-DUSE_CPP_17_BACKPORTS=ON -DEXPRESSION_GENERATOR_BACKPORTS_FOR_CPP17=ON"
            build-type: Release
          - compiler: clang
            compiler-version: 16
            asan-flags: "-fsanitize=address -fno-omit-frame-pointer"
            build-type: RelWithDebInfo
            runner: ubuntu-22.04
            expensive-tests: false
          - compiler: clang
            compiler-version: 16
            ubsan-flags: " -fsanitize=undefined"
            build-type: RelWithDebInfo
            runner: ubuntu-22.04
            expensive-tests: false
          - compiler: clang
            compiler-version: 17
            build-type: Debug
            expensive-tests: false
            ubsan-flags: " -fsanitize=thread -O1 -g"
            additional-cmake-options: "-D_NO_TIMING_TESTS=ON"

    runs-on: ${{matrix.runner || 'ubuntu-24.04'}}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install dependencies
        uses: ./.github/workflows/install-dependencies-ubuntu
      - name: Install compiler
        uses: ./.github/workflows/install-compiler-ubuntu
        with:
          compiler: ${{matrix.compiler}}
          compiler-version: ${{matrix.compiler-version}}
      - name: Reduce address randomization to make sanitizers work
        # For details see for example `https://stackoverflow.com/questions/77850769/fatal-threadsanitizer-unexpected-memory-mapping-when-running-on-linux-kernels`
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl vm.mmap_rnd_bits=28


      - name: Configure CMake
        env:
          USE_PCH: ${{ matrix.compiler-version == 21 && 'ON' || 'OFF' }}
          CHEAPER_COMPILATION: ${{ matrix.compiler-version == 11 && 'ON' || 'OFF' }}
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DCMAKE_TOOLCHAIN_FILE="$(pwd)/toolchains/${{matrix.compiler}}${{matrix.compiler-version}}.cmake" -DADDITIONAL_COMPILER_FLAGS="${{matrix.warnings}} ${{matrix.asan-flags}} ${{matrix.ubsan-flags}}" -DUSE_PARALLEL=true -DRUN_EXPENSIVE_TESTS=${{matrix.expensive-tests}} -DENABLE_EXPENSIVE_CHECKS=true ${{matrix.additional-cmake-options}} -DADDITIONAL_LINKER_FLAGS="-B /usr/bin/mold" -DBUILD_SHARED_LIBS=ON -DQLEVER_ONE_TEST_CASE_PER_FILE=ON -DUSE_PRECOMPILED_HEADERS=${{env.USE_PCH}} -DCHEAPER_COMPILATION=${{env.CHEAPER_COMPILATION}}

      - name: Build
        # Build your program with the given configuration
        run: |
          cmake --build ${{github.workspace}}/build --config ${{matrix.build-type}} -- -j $(nproc)
        id: build

      - name: Test
        id: complete_tests
        working-directory: ${{github.workspace}}/build/test
        run: env CTEST_OUTPUT_ON_FAILURE=1 ctest -C ${{matrix.build-type}} -j $(nproc) .

      - name: Running and printing the benchmark examples.
        run: ${{github.workspace}}/build/benchmark/BenchmarkExamples -p

      # Run the E2E test only once, but for GCC add the text index separately.
      # Note that the dispatch by the compiler is arbitrary, we just want
      # to have both cases tested.
      - name: E2E with index in one go
        if: (matrix.compiler == 'clang') && (steps.complete_tests.outcome == 'success')
        run: ${{github.workspace}}/e2e/e2e.sh

      - name: E2E with separate text index build
        if: (matrix.compiler != 'clang')  && (steps.complete_tests.outcome == 'success')
        run: ${{github.workspace}}/e2e/e2e.sh -t

  # A single job that succeeds if and only if all the matrix jobs above have
  # succeeded. Its name does not depend on the matrix, so it is stable across
  # the `pull_request` and the `merge_group` event, and it is therefore the job
  # that should be configured as a required status check on GitHub. Requiring
  # the individual matrix jobs instead would not work, because the jobs that are
  # only run in the merge queue would never be reported for a pull request, so
  # the pull request could never be added to the merge queue in the first place.
  native-build-successful:
    name: Native build successful
    # `always()` is required, such that this job also runs (and then fails) when
    # one of the matrix jobs has failed or was cancelled.
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check the result of the matrix jobs
        if: needs.build.result != 'success'
        run: |
          echo "At least one of the native builds failed (result: ${{needs.build.result}})"
          exit 1
