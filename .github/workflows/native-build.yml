name: Native build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    # Also run when a label is applied, s.t. applying the `run-full-ci` label
    # triggers the expensive checks (see `full-ci-gate.yml`).
    types: [ opened, synchronize, reopened, labeled ]
  merge_group:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

# The default GITHUB_TOKEN only needs to read the repository here.
permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/full-ci-gate.yml

  # The cheap configurations that are run for every PR.
  build:

    # The CMake configure and build commands are platform-agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc]
        compiler-version: [13]
        # `-Woverloaded-virtual` is not part of `-Wall`/`-Wextra`. It catches
        # virtual functions that a derived class hides with an overload of the
        # same name (e.g. a `const` and a non-const overload where only the
        # non-const one is overridden). Only GCC warns about that case.
        warnings: &warnings [  "-Wall -Wextra -Werror -Woverloaded-virtual " ]
        build-type: [Release]
        expensive-tests: [true]
        additional-cmake-options: [""]
        include:
          - compiler: gcc
            compiler-version: 11
            additional-cmake-options: "-DUSE_CPP_17_BACKPORTS=ON -DEXPRESSION_GENERATOR_BACKPORTS_FOR_CPP17=ON"
            build-type: Release
          - compiler: clang
            compiler-version: 16
            asan-flags: "-fsanitize=address -fno-omit-frame-pointer"
            build-type: RelWithDebInfo
            runner: ubuntu-22.04
            expensive-tests: false
          - compiler: clang
            compiler-version: 16
            ubsan-flags: " -fsanitize=undefined"
            build-type: RelWithDebInfo
            runner: ubuntu-22.04
            expensive-tests: false

    runs-on: &runs-on ${{matrix.runner || 'ubuntu-24.04'}}

    env: &env
      # Suppress known ThreadSanitizer false positives in third-party libraries
      # (see the comments in the file for details). This only affects the job
      # that builds with `-fsanitize=thread`, all other jobs ignore the variable.
      TSAN_OPTIONS: "suppressions=${{github.workspace}}/misc/tsan-suppressions.txt"

    steps: &steps
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install dependencies
        uses: ./.github/workflows/install-dependencies-ubuntu
      - name: Install compiler
        uses: ./.github/workflows/install-compiler-ubuntu
        with:
          compiler: ${{matrix.compiler}}
          compiler-version: ${{matrix.compiler-version}}
      - name: Reduce address randomization to make sanitizers work
        # For details see for example `https://stackoverflow.com/questions/77850769/fatal-threadsanitizer-unexpected-memory-mapping-when-running-on-linux-kernels`
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl vm.mmap_rnd_bits=28


      - name: Configure, build, and test
        uses: ./.github/workflows/build-and-test
        with:
          build-type: ${{matrix.build-type}}
          cmake-args: >-
            -DCMAKE_TOOLCHAIN_FILE="$(pwd)/toolchains/${{matrix.compiler}}${{matrix.compiler-version}}.cmake"
            -DADDITIONAL_COMPILER_FLAGS="${{matrix.warnings}} ${{matrix.asan-flags}} ${{matrix.ubsan-flags}}"
            -DADDITIONAL_LINKER_FLAGS="-fuse-ld=mold"
            -DUSE_PARALLEL=true
            -DRUN_EXPENSIVE_TESTS=${{matrix.expensive-tests}}
            -DENABLE_EXPENSIVE_CHECKS=true
            ${{matrix.additional-cmake-options}}
            -DBUILD_SHARED_LIBS=ON
            -DQLEVER_ONE_TEST_CASE_PER_FILE=ON
            -DUSE_PRECOMPILED_HEADERS=${{matrix.compiler-version == 21 && 'ON' || 'OFF'}}
            -DCHEAPER_COMPILATION=${{matrix.compiler-version == 11 && 'ON' || 'OFF'}}
            -DQLEVER_ALLOCATOR_BACKEND=${{matrix.allocator-backend || 'limit'}}
          # Run the E2E test only once with the index built in one go, but for
          # GCC add the text index separately.
          #
          # NOTE: The dispatch by the compiler is arbitrary, we just want to
          # have both cases tested.
          e2e-args: ${{matrix.compiler != 'clang' && '-t' || ''}}

  # The expensive configurations, which are only run for PRs with the
  # `run-full-ci` label (see `full-ci-gate.yml`) and always on `master`.
  build-full:
    needs: gate
    if: needs.gate.outputs.run-full-ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        compiler-version: [11, 12, 18, 21]
        warnings: *warnings
        build-type: [Release]
        expensive-tests: [true]
        additional-cmake-options: [""]
        isPr:
          - ${{github.event_name == 'pull_request'}}  # some checks are only run in the master.
        exclude:
          - compiler: gcc
            compiler-version: 12
            isPr: true
          - compiler: gcc
            compiler-version: 18
          - compiler: gcc
            compiler-version: 21
          - compiler: clang
            compiler-version: 11
          - compiler: clang
            compiler-version: 12
          - compiler: clang
            compiler-version: 18
            isPr: true
        include:
          # Exercise the PMR allocator backend in one ordinary configuration so
          # that `QLEVER_USE_PMR_ALLOCATOR` code is actually built and tested in
          # CI. NOTE: This entry does not add a new job. Since all its other
          # values match the existing clang-21 configuration, it is merged into
          # that job, which hence builds with the PMR backend INSTEAD OF the
          # default `limit` backend (all other configurations are unaffected).
          - compiler: clang
            compiler-version: 21
            allocator-backend: pmr
            build-type: Release
          - compiler: clang
            compiler-version: 17
            build-type: Debug
            expensive-tests: false
            ubsan-flags: " -fsanitize=thread -O1 -g"
            additional-cmake-options: "-D_NO_TIMING_TESTS=ON"

    runs-on: *runs-on
    env: *env
    steps: *steps
