# Build QLever with the newest GCC versions. These are only run for PRs with
# the `run-full-ci` label (see `README.md`) and always on `master`.
#
# NOTE: `ppa:ubuntu-toolchain-r/test` only provides a pre-release snapshot of
# GCC 16 (`16-20260315`), whose warnings can differ from those of the released
# GCC 16. A failure in this workflow can therefore be unrelated to the change
# that happens to trigger it.
name: Native build with the newest compilers

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    # Also run when a label is applied, so that applying the `run-ci` or
    # `run-full-ci` label triggers the checks, see `README.md`.
    types: [ opened, synchronize, reopened, labeled ]
  merge_group:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

# The default GITHUB_TOKEN only needs to read the repository here.
permissions:
  contents: read

jobs:
  build:
    # Only run for PRs with the `run-full-ci` label, see `README.md`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc]
        compiler-version: [15, 16]
        warnings: [  "-Wall -Wextra -Werror -Woverloaded-virtual " ]
        build-type: [Release]
        expensive-tests: [true]
        additional-cmake-options: [""]

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install dependencies, configure, build, and test
        uses: ./.github/workflows/native-build-steps
        with:
          matrix: ${{ toJSON(matrix) }}
