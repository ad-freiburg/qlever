name: Native build (full CI)

# The expensive native builds, which are only run for PRs with the
# `run-full-ci` label (see `README.md`) and always on `master`. The cheap ones
# are in `native-build-always.yml`.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    # Also run when a label is applied, so that applying the `run-ci` or
    # `run-full-ci` label triggers the checks, see `README.md`.
    types: [ opened, synchronize, reopened, labeled ]
  merge_group:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

# The default GITHUB_TOKEN only needs to read the repository here.
permissions:
  contents: read

jobs:
  build:
    # Only run for PRs with the `run-full-ci` label, see `README.md`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        compiler-version: [11, 12, 18, 21]
        # `-Woverloaded-virtual` is not part of `-Wall`/`-Wextra`. It catches
        # virtual functions that a derived class hides with an overload of the
        # same name (e.g. a `const` and a non-const overload where only the
        # non-const one is overridden). Only GCC warns about that case.
        warnings: [  "-Wall -Wextra -Werror -Woverloaded-virtual " ]
        build-type: [Release]
        expensive-tests: [true]
        additional-cmake-options: [""]
        isPr:
          - ${{github.event_name == 'pull_request'}}  # some checks are only run in the master.
        exclude:
          - compiler: gcc
            compiler-version: 12
            isPr: true
          - compiler: gcc
            compiler-version: 18
          - compiler: gcc
            compiler-version: 21
          - compiler: clang
            compiler-version: 11
          - compiler: clang
            compiler-version: 12
          - compiler: clang
            compiler-version: 18
            isPr: true
        include:
          # Exercise the PMR allocator backend in one ordinary configuration so
          # that `QLEVER_USE_PMR_ALLOCATOR` code is actually built and tested in
          # CI. NOTE: This entry does not add a new job. Since all its other
          # values match the existing clang-21 configuration, it is merged into
          # that job, which hence builds with the PMR backend INSTEAD OF the
          # default `limit` backend (all other configurations are unaffected).
          - compiler: clang
            compiler-version: 21
            allocator-backend: pmr
            build-type: Release
          - compiler: clang
            compiler-version: 17
            build-type: Debug
            expensive-tests: false
            ubsan-flags: " -fsanitize=thread -O1 -g"
            additional-cmake-options: "-D_NO_TIMING_TESTS=ON"

    runs-on: ${{matrix.runner || 'ubuntu-24.04'}}

    env:
      # Suppress known ThreadSanitizer false positives in third-party libraries
      # (see the comments in the file for details). This only affects the job
      # that builds with `-fsanitize=thread`, all other jobs ignore the variable.
      TSAN_OPTIONS: "suppressions=${{github.workspace}}/misc/tsan-suppressions.txt"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install dependencies, configure, build, and test
        uses: ./.github/workflows/native-build-steps
        with:
          matrix: ${{ toJSON(matrix) }}
