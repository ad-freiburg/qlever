name: CI repair

on:
  workflow_run:
    workflows:
      - Native build
      - Native build with AppleClang on MacOS
      - Native build with conan
      - Native build with conan on MacOS
      - Native build to WebAssembly using Conan and Emscripten
      - Docker build and publish
      - CPP17 libQLever
      - measure-code-coverage
      - sparql-conformance
      - sparql-conformance-new
      - Check index version
      - Format check
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ci-repair-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  classify-or-repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, ci-repair-local]
    timeout-minutes: 30
    env:
      PATH: /home/userNoPriv/.local/bin:/home/userNoPriv/.local/share/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /home/userNoPriv/code/ci-repair-harness
    steps:
      - name: Run harness
        env:
          CI_REPAIR_PUSH_TOKEN: ${{ secrets.CI_REPAIR_PUSH_TOKEN }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
        run: |
          # github.token must not open the probe PR: this repo gates CI on the
          # `ci` label, and GITHUB_TOKEN events do not start other workflows.
          if [ -n "${CI_REPAIR_PUSH_TOKEN}" ]; then
            export GH_TOKEN="${CI_REPAIR_PUSH_TOKEN}"
          else
            unset GH_TOKEN
            unset GITHUB_TOKEN
          fi
          python3 /home/userNoPriv/code/ci-repair-harness/cli.py \
            handle-run --run-id "${{ github.event.workflow_run.id }}"
